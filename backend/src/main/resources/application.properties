# ============================================================================
# VOLTIX — Urban EV Charging Network Management System
# Configuration: application.properties
# ============================================================================

server.port=${SERVER_PORT:8082}
server.servlet.context-path=/

# Database Configuration (MySQL 8.0+)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:voltix_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:9163010092}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration (Validates against existing voltix_db schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Authentication Security Settings
voltix.jwt.secret=${JWT_SECRET:VoltixEVChargingNetworkSuperSecretKeyWithSufficientLengthForHMACSHA256SecurityStandard2026}
voltix.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
voltix.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Demo Seeding (Enabled by default to ensure dev accounts have functional BCrypt passwords)
voltix.seed.demo-users-enabled=${SEED_DEMO_USERS:true}

# Spring Boot Actuator Observability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.root=INFO
logging.level.com.voltix=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
