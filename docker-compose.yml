services:
  mysql:
    image: mysql:8.0
    container_name: voltix-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: voltix_db
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
      - ./database/init-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - voltix-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voltix-backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: voltix_db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      JWT_SECRET: VoltixEVChargingNetworkSuperSecretKeyWithSufficientLengthForHMACSHA256SecurityStandard2026
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    ports:
      - "${BACKEND_PORT:-8082}:8080"
    networks:
      - voltix-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voltix-frontend
    restart: on-failure
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - voltix-net

volumes:
  mysql_data:
    driver: local

networks:
  voltix-net:
    driver: bridge
